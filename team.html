<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>寻找队友 — 竞赛信息门户</title>
<link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="auth.css">
<link rel="stylesheet" href="live.css">
<link rel="stylesheet" href="team-theme.css?v=2">
</head>
<body>
<header class="site-header"><div class="nav"><a class="logo" href="index.html"><i class="fas fa-trophy" aria-hidden="true"></i>竞赛信息门户</a><nav class="nav-links" aria-label="主导航"><a href="index.html">竞赛资讯</a><a class="active" aria-current="page" href="team.html">寻找队友</a><a href="profile.html">个人中心</a></nav></div></header>
<main class="team-page">
  <div class="page-heading"><div><h1>寻找队友</h1><p>选一场比赛，看看哪些队伍正在招募。</p></div><div class="page-actions"><a href="#conversations-wrap" id="conversations-link" hidden>私聊消息</a><button class="chat-button" id="open-publish" type="button" hidden>＋ 发布招募</button></div></div>
  <section class="panel search-panel" aria-label="查找比赛招募">
    <div class="search-field"><label for="competition-select">你想参加哪场比赛？</label><select id="competition-select"><option value="">选择比赛</option></select></div>
    <details class="more-filters"><summary>更多筛选 <span id="filter-count"></span></summary><div class="filter-fields">
      <div class="search-field"><label for="search-major">队长专业</label><input id="search-major" maxlength="60" autocomplete="off" placeholder="不限专业"></div>
      <div class="search-field"><label for="search-grade">队长年级</label><select id="search-grade"><option value="">不限年级</option><option>大一</option><option>大二</option><option>大三</option><option>大四</option><option>研一</option><option>研二</option></select></div>
      <button type="button" class="secondary-button" data-clear-filters>清除筛选</button>
    </div></details>
  </section>
  <section class="feed" aria-labelledby="live-title">
    <div class="feed-heading"><h2 id="live-title">正在招募 <span id="live-count"></span></h2><a href="#my-posts-wrap" id="my-posts-link" hidden>我的招募</a></div>
    <p id="live-status" class="live-status" role="status"></p>
    <div id="live-login" class="panel live-login" hidden>登录后查看真实招募、发布需求或联系队长。 <a href="account.html">登录 / 注册</a></div>
    <div id="live-posts" class="live-posts" aria-live="polite" aria-busy="true"><div class="live-empty">正在连接账号服务…</div></div>
  </section>
  <details class="panel utility-panel" id="my-posts-wrap" hidden><summary>我的招募</summary><div id="my-posts"></div></details>
  <details class="panel utility-panel" id="conversations-wrap" hidden><summary class="live-subhead">最近私聊</summary><div id="live-conversations"></div></details>
  <p class="lab-entry">还没想好参加什么？ <a href="lab.html">去组队实验室找灵感 →</a></p>
</main>
<footer>竞赛信息门户 · <a href="mailto:3352875852@qq.com">3352875852@qq.com</a></footer>

<dialog id="publish-dialog" aria-labelledby="publish-title">
  <div class="publish-head"><div><h2 id="publish-title">发布招募</h2><p id="publish-contest"></p></div><form method="dialog"><button type="submit" class="secondary-button">关闭</button></form></div>
  <div class="search-field"><label for="recruit-count">计划招募人数</label><select id="recruit-count"><option value="1">1 人</option><option value="2">2 人</option><option value="3">3 人</option><option value="4">4 人</option><option value="5">5 人</option></select></div>
  <div class="search-field"><label id="search-domains-title">希望队友擅长什么？</label><p class="muted">至少选一个领域，也可以添加自定义标签。</p><div class="tag-picker" id="search-domains" role="group" aria-labelledby="search-domains-title"></div></div>
  <details class="member-details" id="member-details"><summary>已有成员 <span id="team-size"></span></summary><div id="team-members"></div>
    <form class="team-add" id="add-member-form"><input id="member-name" aria-label="新成员姓名" maxlength="30" placeholder="成员姓名" required><input id="member-role" aria-label="新成员分工" maxlength="40" placeholder="负责领域" required><button class="secondary-button" type="submit">添加成员</button></form>
  </details>
  <p class="muted">发布后，其他参赛同学可查看你的<a href="profile.html">个人中心资料</a>和这次填写的成员、招募需求。</p>
  <p id="publish-status" class="live-status" role="status"></p>
  <button class="chat-button" id="publish-current" type="button">确认发布</button>
</dialog>

 <div class="chat-overlay" id="chat-overlay" hidden><section class="chat-dialog" role="dialog" aria-modal="true" aria-labelledby="chat-title"><div class="chat-header"><div><h2 id="chat-title"></h2><p id="chat-mode-note">消息仅对会话参与者可见</p></div><button type="button" class="chat-close" id="chat-close" aria-label="关闭私聊">×</button></div><div class="chat-log" id="chat-log" role="log" aria-live="polite"></div><div class="chat-compose"><div class="chat-shortcuts"><button type="button" id="share-profile">发送我的竞赛资料</button><button type="button" id="share-team">发送当前队伍状态</button></div><textarea id="chat-input" maxlength="1000" placeholder="输入想对这位同学说的话……"></textarea><div class="chat-compose-row"><span id="chat-send-note"></span><button class="chat-button" type="button" id="chat-send">发送消息</button></div></div></section></div>
<script src="profile.js"></script>
<script src="matching-data.js"></script>
<script src="api-client.js"></script>
<script src="auth-nav.js"></script>
<script>
let profile={};
const competitionSelect=document.getElementById('competition-select');
Object.entries(matchScenarios).forEach(([key,scenario])=>competitionSelect.add(new Option(scenario.label,key)));

const TEAM_KEY='competition.team.v1';
let activeTeamStorageKey=TEAM_KEY;
function readTeamState(storageKey){try{const value=JSON.parse(localStorage.getItem(storageKey));return value&&typeof value==='object'&&!Array.isArray(value)?value:{};}catch(_){return {};}}
let savedTeams=readTeamState(activeTeamStorageKey);
function switchTeamState(userId){activeTeamStorageKey=userId?`${TEAM_KEY}.account.${userId}`:TEAM_KEY;savedTeams=readTeamState(activeTeamStorageKey);}
function teamFor(key){
  return savedTeams[key] ||= {members:[],gaps:key===profile.competition?splitProfileList(profile.wanted):[],recruitCount:1};
}
function updateTeam(){
  try{localStorage.setItem(activeTeamStorageKey,JSON.stringify(savedTeams));}catch(_){/* 本次访问仍可编辑。 */}
  renderTeam(competitionSelect.value);
}
const domainPicker=createTagPicker(document.getElementById('search-domains'),domainTagGroups,()=>{
  teamFor(competitionSelect.value).gaps=domainPicker.getSelected();updateTeam();
});
const customGroup=document.querySelector('#search-domains .tag-group:last-child');
const customDetails=document.createElement('details');
customDetails.className='tag-group custom-tag-details';
const customSummary=document.createElement('summary');
customSummary.className='tag-group-title';
customSummary.textContent='添加自定义标签';
customDetails.append(customSummary,...Array.from(customGroup.children).slice(1));
customGroup.replaceWith(customDetails);
function escapeHtml(value){return String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));}
function renderTeam(key){
  const state=teamFor(key);
  document.getElementById('publish-contest').textContent=matchScenarios[key].label;
  document.getElementById('team-size').textContent='· '+(state.members.length+1)+' 人（含我）';
  document.getElementById('recruit-count').value=String(state.recruitCount||1);
  document.getElementById('team-members').innerHTML=state.members.map((member,index)=>'<div class="team-member"><span>'+escapeHtml(member.name)+' · '+escapeHtml(member.role)+'</span><button type="button" class="secondary-button remove-member" data-index="'+index+'" aria-label="移除'+escapeHtml(member.name)+'">移除</button></div>').join('');
}
const publishDialog=document.getElementById('publish-dialog');
const publishButton=document.getElementById('open-publish');
let pendingPublish=false;
function openPublish(){
  if(!competitionSelect.value){
    pendingPublish=true;
    setStatus('先选择要发布招募的比赛。');
    competitionSelect.focus();
    return;
  }
  pendingPublish=false;
  renderTeam(competitionSelect.value);
  const team=teamFor(competitionSelect.value);
  domainPicker.setSelected(team.gaps);
  document.getElementById('member-details').open=team.members.length>0;
  document.getElementById('publish-status').textContent='';
  publishDialog.showModal();
}
function setStatus(message,isError=false){
  const status=document.getElementById('live-status');
  status.textContent=message;
  status.classList.toggle('error',isError);
}
publishButton.addEventListener('click',openPublish);
competitionSelect.addEventListener('change',()=>{
  if(pendingPublish&&competitionSelect.value) openPublish();
});
document.getElementById('recruit-count').addEventListener('change',event=>{
  teamFor(competitionSelect.value).recruitCount=Number(event.target.value);updateTeam();
});
document.getElementById('add-member-form').addEventListener('submit',event=>{
  event.preventDefault();
  const name=document.getElementById('member-name').value.trim(),role=document.getElementById('member-role').value.trim();
  if(!name||!role)return;
  const members=teamFor(competitionSelect.value).members;
  if(members.length>=9){alert('最多添加 9 位其他成员。');return;}
  members.push({name,role});event.target.reset();updateTeam();
});
document.getElementById('team-members').addEventListener('click',event=>{
  const button=event.target.closest('.remove-member');if(!button)return;
  teamFor(competitionSelect.value).members.splice(Number(button.dataset.index),1);updateTeam();
});
let previousFocus=null;
function addBubble(message,mine){
  const bubble=document.createElement('div');bubble.className=`bubble${mine?' mine':''}`;bubble.textContent=message;
  document.getElementById('chat-log').append(bubble);
  document.getElementById('chat-log').scrollTop=document.getElementById('chat-log').scrollHeight;
}
function sendChat(message){window.sendLiveChatMessage?.(message);}
function closeChat(){
 window.clearLiveChat?.();
  document.getElementById('chat-overlay').hidden=true;document.body.style.overflow='';
  if(previousFocus?.isConnected)previousFocus.focus();
  else document.getElementById('conversations-link').focus();
}
document.getElementById('chat-close').addEventListener('click',closeChat);
document.getElementById('chat-overlay').addEventListener('click',event=>{if(event.target.id==='chat-overlay')closeChat();});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!document.getElementById('chat-overlay').hidden)closeChat();});
document.getElementById('chat-send').addEventListener('click',()=>sendChat(document.getElementById('chat-input').value));
document.getElementById('chat-input').addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();sendChat(event.target.value);}});
document.getElementById('share-profile').addEventListener('click',()=>{
  sendChat(`【我的竞赛资料】\n姓名：${profile.name||'未填写'}\n学校 / 专业 / 年级：${[profile.school,profile.major,profile.grade].filter(Boolean).join(' · ')||'未填写'}\n技能：${profile.skills||'未填写'}\n竞赛经历：${profile.experience||'未填写'}\n个人目标比赛：${matchScenarios[profile.competition]?.label||'未填写'}\n本次组队比赛：${(matchScenarios[competitionSelect.value]?.label||'未选择')}\n队伍定位：${profile.role||'未填写'}`);
});
document.getElementById('share-team').addEventListener('click',()=>{
  if(!competitionSelect.value){document.getElementById('chat-send-note').textContent='请先在寻找队友页面选择比赛，再分享队伍状态。';return;}
  const team=teamFor(competitionSelect.value);
  sendChat(`【当前队伍需求】\n比赛：${(matchScenarios[competitionSelect.value]?.label||'未选择')}\n我的定位：${profile.role||'未填写'}\n需要补充：${team.gaps.join('、')||'暂未设置'}\n计划招募：${team.recruitCount} 人`);
});
</script>
<script src="team-live.js?v=2"></script>
</body>
</html>
