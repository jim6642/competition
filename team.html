<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>智能寻找队友 — 竞赛信息门户</title>
<link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--primary:#4f46e5;--bg:#f1f5f9;--card:#fff;--text:#1e293b;--muted:#64748b}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
header{background:#fff;padding:15px 30px;box-shadow:0 2px 10px #0001}.nav{max-width:1200px;margin:auto;display:flex;justify-content:space-between}.logo{color:var(--primary);font-weight:800;font-size:22px}.nav a{text-decoration:none;color:#64748b;margin-left:20px}
.container{max-width:1200px;margin:auto;padding:30px}.hero{text-align:center;margin-bottom:30px}.hero h1{font-size:32px}.hero p{color:var(--muted)}
.layout{display:grid;grid-template-columns:350px 1fr;gap:25px}.card{background:white;border-radius:16px;padding:25px;box-shadow:0 5px 20px #0001}.form label{font-size:14px;font-weight:bold}.form input,.form select{width:100%;margin:8px 0 15px;padding:12px;border:1px solid #ddd;border-radius:8px}.btn{background:var(--primary);color:white;border:0;padding:12px;width:100%;border-radius:8px;cursor:pointer}
.match{display:flex;align-items:center;justify-content:space-between;border:1px solid #eee;padding:18px;border-radius:12px;margin-bottom:15px}.score{font-size:24px;color:var(--primary);font-weight:bold}.tag{display:inline-block;background:#eef2ff;color:var(--primary);padding:3px 10px;border-radius:15px;font-size:12px;margin:3px}
.reason{color:var(--muted);font-size:14px;margin-top:8px}@media(max-width:800px){.layout{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="nav"><div class="logo"><i class="fa fa-trophy"></i> 竞赛信息门户</div><div><a href="index.html">竞赛资讯</a><a href="team.html">寻找队友</a><a href="resources.html">资料分享</a></div></div></header>
<div class="container">
<div class="hero"><h1>🤝 智能寻找竞赛队友</h1><p>根据专业、技能和比赛方向，发现能力互补的伙伴</p></div>
<div class="layout">
<div class="card form"><h2>我的能力画像</h2><br><label>专业</label><input value="微电子科学与工程"><label>技能</label><input value="Verilog, FPGA, PCB设计"><label>目标竞赛</label><select><option>全国大学生电子设计竞赛</option><option>FPGA创新设计竞赛</option></select><button class="btn" onclick="match()">开始智能匹配</button></div>
<div class="card"><h2>推荐队友</h2><div id="result" style="margin-top:20px"></div></div>
</div></div>
<script>
const users=[
{name:'李同学',major:'计算机科学与技术',skills:['Python','OpenCV','算法'],score:92,reason:'你负责硬件设计，他可以负责算法和视觉开发，适合智能车/电子设计竞赛'},
{name:'王同学',major:'自动化',skills:['STM32','嵌入式','控制'],score:87,reason:'嵌入式方向互补，可以与你的FPGA经验结合'},
{name:'陈同学',major:'机械工程',skills:['CAD','结构设计'],score:76,reason:'适合机器人类竞赛，补充机械结构能力'}];
function match(){document.getElementById('result').innerHTML=users.map(u=>`<div class="match"><div><h3>${u.name}</h3><p>${u.major}</p>${u.skills.map(s=>`<span class="tag">${s}</span>`).join('')}<div class="reason">推荐理由：${u.reason}</div></div><div class="score">${u.score}%</div></div>`).join('')}
match();
</script>
</body>
</html>
