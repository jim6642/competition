<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>智能竞赛组队中心</title>
<link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--p:#4f46e5;--bg:#f1f5f9;--card:#fff;--text:#1e293b;--muted:#64748b}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,"Microsoft YaHei",sans-serif;color:var(--text)}header{background:#fff;padding:16px 30px;box-shadow:0 2px 10px #0001}.nav{max-width:1200px;margin:auto;display:flex;justify-content:space-between}.logo{font-weight:800;color:var(--p);font-size:22px}.nav a{margin-left:20px;color:var(--muted);text-decoration:none}.container{max-width:1200px;margin:auto;padding:30px}.hero{text-align:center;margin-bottom:30px}.hero h1{font-size:36px}.hero p{color:var(--muted)}.grid{display:grid;grid-template-columns:380px 1fr;gap:25px}.card{background:#fff;border-radius:18px;padding:25px;box-shadow:0 5px 20px #0001;margin-bottom:20px}.avatar{width:70px;height:70px;border-radius:50%;background:#eef2ff;color:var(--p);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:bold}.tag{display:inline-block;background:#eef2ff;color:var(--p);padding:5px 12px;border-radius:20px;margin:3px;font-size:13px}.label{color:var(--muted);font-size:13px;margin-top:15px}.status{background:#f8fafc;padding:15px;border-left:4px solid var(--p);margin-top:15px}.match{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:20px;margin-bottom:15px;display:flex;justify-content:space-between}.score{font-size:30px;color:var(--p);font-weight:800}.bar{height:8px;background:#e2e8f0;border-radius:8px;margin:5px 0}.bar span{display:block;height:100%;background:#4f46e5;border-radius:8px}.small{font-size:14px;color:var(--muted)}.role{background:#f8fafc;padding:10px;border-radius:10px;display:inline-block;margin:5px}@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="nav"><div class="logo"><i class="fa fa-trophy"></i> 竞赛信息门户</div><div><a href="index.html">竞赛资讯</a><a href="team.html">寻找队友</a><a href="resources.html">资料分享</a></div></div></header>
<div class="container"><div class="hero"><h1>🤝 智能竞赛组队中心</h1><p>根据个人能力、比赛目标和团队缺口，寻找最合适的竞赛伙伴</p></div>
<div class="grid"><div class="card"><h2>我的竞赛画像</h2><div class="avatar">张</div><h3>张同学</h3><p>电子科技大学 · 微电子科学与工程 · 大三</p><div class="label">团队定位</div><p>硬件设计负责人</p><div class="label">能力标签</div><div><span class="tag">FPGA</span><span class="tag">Verilog</span><span class="tag">PCB</span><span class="tag">模拟电路</span></div><div class="label">竞赛经历</div><p>参与电子设计项目，准备FPGA创新设计竞赛</p><div class="label">目标比赛</div><p>全国大学生电子设计竞赛</p><div class="status"><b>当前队伍缺口</b><br>需要：算法开发、嵌入式方向成员</div></div>
<div><div class="card"><h2>智能匹配结果</h2><div id="list"></div></div><div class="card"><h2>匹配逻辑</h2><p class="small">系统根据以下因素计算匹配度：</p><span class="role">技能互补 40%</span><span class="role">比赛方向 30%</span><span class="role">项目经历 20%</span><span class="role">时间匹配 10%</span></div></div></div></div>
<script>
const users=[{n:'李同学',m:'计算机科学与技术 · 大三',r:'算法负责人',s:['Python','OpenCV','深度学习'],e:'智能车竞赛视觉算法经验',score:94,why:'补充你的算法能力，形成硬件+算法组合'},{n:'王同学',m:'自动化 · 大三',r:'嵌入式开发',s:['STM32','嵌入式','控制系统'],e:'完成嵌入式控制项目',score:89,why:'补充软件和控制能力，适合电子设计竞赛'},{n:'陈同学',m:'机械工程 · 大二',r:'结构设计',s:['CAD','机械设计','建模'],e:'机器人竞赛经历',score:78,why:'适合机器人方向，补充机械能力'}];
document.getElementById('list').innerHTML=users.map(u=>`<div class="match"><div><h3>${u.n}</h3><p>${u.m} · ${u.r}</p>${u.s.map(x=>`<span class="tag">${x}</span>`).join('')}<p class="small">竞赛经历：${u.e}</p><p><b>推荐原因：</b>${u.why}</p><div>技能互补<div class="bar"><span style="width:${u.score}%"></span></div></div></div><div class="score">${u.score}%</div></div>`).join('');
</script></body></html>
