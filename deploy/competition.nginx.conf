# Install only after the separate competition.thirdplayer.cn certificate exists.
server {
    listen 80;
    listen [::]:80;
    server_name competition.thirdplayer.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name competition.thirdplayer.cn;

    ssl_certificate /etc/letsencrypt/live/competition.thirdplayer.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/competition.thirdplayer.cn/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
