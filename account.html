<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 / 注册 — 竞赛信息门户</title>
<link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="auth.css">
<style>
:root{--primary:#4f46e5;--soft:#eef2ff;--bg:#f1f5f9;--text:#1e293b;--muted:#64748b;--line:#e2e8f0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.6}a{text-decoration:none;color:inherit}button,input{font:inherit}header{position:sticky;top:0;z-index:20;background:#fffffff0;backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}.nav{max-width:1400px;margin:auto;padding:.9rem 1.5rem;display:flex;align-items:center;justify-content:space-between;gap:20px}.logo{display:flex;align-items:center;gap:10px;color:var(--primary);font-size:1.35rem;font-weight:700;white-space:nowrap}.logo i{font-size:1.6rem}.nav-links{display:flex;align-items:center;gap:1.2rem}.nav-links a{padding:.4rem .65rem;border-radius:8px;color:var(--muted);font-size:.9rem;font-weight:500;white-space:nowrap}.nav-links a:hover,.nav-links a.active{background:var(--soft);color:var(--primary)}.hero{background:linear-gradient(135deg,#4f46e5,#7c3aed 60%,#a855f7);color:#fff}.hero-inner{max-width:900px;margin:auto;padding:50px 24px 78px}.hero h1{margin:0 0 8px;font-size:clamp(1.8rem,4vw,2.5rem)}.hero p{margin:0;color:#eef2ff}.container{max-width:900px;margin:-38px auto 0;padding:0 24px 60px;position:relative}.panel{max-width:520px;margin:auto;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 2px 8px #1e293b0b;padding:26px}.tabs{display:flex;gap:8px;margin-bottom:20px}.tabs button{flex:1;border:1px solid var(--line);border-radius:9px;padding:9px;background:#fff;color:var(--muted);font-weight:700;cursor:pointer}.tabs button[aria-pressed="true"]{background:var(--soft);border-color:#c7d2fe;color:var(--primary)}.field{margin:14px 0}.field label{display:block;margin-bottom:6px;font-size:.82rem;font-weight:700}.field input{width:100%;padding:11px 12px;border:1px solid #cbd5e1;border-radius:9px;background:#fff;color:var(--text)}.field input:focus{outline:2px solid #a5b4fc;border-color:var(--primary)}.help{margin:4px 0;color:var(--muted);font-size:.77rem}.submit{width:100%;margin-top:8px;border:0;border-radius:9px;background:var(--primary);color:#fff;padding:11px;font-weight:700;cursor:pointer}.submit:hover{background:#4338ca}.submit:disabled{opacity:.6;cursor:wait}.status{min-height:24px;margin:12px 0 0;color:#047857;font-size:.82rem}.status.error{color:#b91c1c}.local-note{margin:16px 0 0;padding:12px;border-radius:9px;background:#f8fafc;color:var(--muted);font-size:.78rem}.local-note a{color:var(--primary);font-weight:700}footer{padding:25px 20px;text-align:center;background:#1e293b;color:#94a3b8;font-size:.8rem}@media(max-width:600px){.nav{align-items:flex-start;flex-direction:column;padding:12px 16px;gap:8px}.logo{font-size:1.05rem}.nav-links{width:100%;overflow-x:auto;gap:4px}.nav-links a{font-size:.78rem;padding:.35rem .5rem}.hero-inner{padding:36px 18px 67px}.container{padding:0 14px 40px}.panel{padding:20px}}
</style>
</head>
<body>
<header><div class="nav"><a class="logo" href="index.html"><i class="fas fa-trophy"></i>竞赛信息门户</a><nav class="nav-links" aria-label="主导航"><a href="index.html">竞赛资讯</a><a href="team.html">寻找队友</a><a href="profile.html">个人中心</a></nav></div></header>
<section class="hero"><div class="hero-inner"><h1>进入竞赛组队社区</h1><p>登录后同步竞赛画像、发布招募信息，并与真实队友交流。</p></div></section>
<main class="container"><section class="panel" aria-label="账号登录和注册"><div class="tabs"><button type="button" id="login-tab" aria-pressed="true">登录</button><button type="button" id="register-tab" aria-pressed="false">注册账号</button></div><form id="account-form"><div class="field"><label for="username">用户名</label><input id="username" name="username" autocomplete="username" minlength="2" maxlength="24" required><p class="help">2–24 位中文、字母、数字、下划线或短横线。</p></div><div class="field"><label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" minlength="8" maxlength="128" required><p class="help" id="password-help">至少 8 位。请妥善保管密码。</p></div><div class="field" id="confirm-wrap" hidden><label for="confirm-password">确认密码</label><input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" minlength="8" maxlength="128"></div><button class="submit" id="submit-button" type="submit">登录</button><p class="status" id="form-status" role="status" aria-live="polite"></p></form><p class="local-note">GitHub Pages 仍提供匿名演示。账号功能只在竞赛站服务器启用。注册后建议到<a href="profile.html">个人中心</a>补充学校、专业和年级。</p></section></main>
<footer>竞赛信息门户 · 让每一种能力都找到合适的赛场<br><a href="mailto:3352875852@qq.com" style="color:#cbd5e1;text-decoration:underline;text-underline-offset:3px">📧 3352875852@qq.com</a></footer>
<script src="profile.js"></script><script src="api-client.js"></script><script src="auth-nav.js"></script>
<script>
const form=document.getElementById('account-form'),status=document.getElementById('form-status'),submit=document.getElementById('submit-button');
let mode='login';
const returnPage=new URLSearchParams(window.location.search).get('next')==='lab.html'?'lab.html':'team.html';
function setMode(value){mode=value;const registering=mode==='register';document.getElementById('login-tab').setAttribute('aria-pressed',String(!registering));document.getElementById('register-tab').setAttribute('aria-pressed',String(registering));document.getElementById('confirm-wrap').hidden=!registering;document.getElementById('confirm-password').required=registering;document.getElementById('password').autocomplete=registering?'new-password':'current-password';document.getElementById('password-help').textContent=registering?'至少 8 位。当前暂不提供邮箱找回密码，请妥善保管。':'至少 8 位。请妥善保管密码。';submit.textContent=registering?'创建账号':'登录';status.textContent='';status.classList.remove('error');}
document.getElementById('login-tab').addEventListener('click',()=>setMode('login'));
document.getElementById('register-tab').addEventListener('click',()=>setMode('register'));
form.addEventListener('submit',async event=>{event.preventDefault();if(!form.reportValidity())return;if(!CompetitionAPI.enabled){status.textContent='当前页面没有连接账号服务器，请使用竞赛站域名。';status.classList.add('error');return;}const username=form.elements.username.value.trim(),password=form.elements.password.value;if(mode==='register'&&password!==form.elements['confirm-password'].value){status.textContent='两次输入的密码不一致。';status.classList.add('error');return;}submit.disabled=true;status.textContent=mode==='register'?'正在创建账号……':'正在登录……';status.classList.remove('error');try{if(mode==='register')await CompetitionAPI.register(username,password,loadProfile());else await CompetitionAPI.login(username,password);window.location.href=returnPage;}catch(error){status.textContent=error.message;status.classList.add('error');submit.disabled=false;}});
if(CompetitionAPI.enabled)CompetitionAPI.me().then(({user})=>{if(user){status.textContent=`已登录为 ${user.username}，正在进入${returnPage==='lab.html'?'组队实验室':'寻找队友'}……`;setTimeout(()=>window.location.href=returnPage,500);}}).catch(()=>{});
</script>
</body>
</html>
